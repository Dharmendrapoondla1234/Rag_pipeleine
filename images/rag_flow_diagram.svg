<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <rect x="60" y="40" width="1080" height="620" rx="24" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  <text x="600" y="95" text-anchor="middle" font-family="Segoe UI, Arial" font-size="34" font-weight="700" fill="#0f172a">RAG Pipeline: From Documents to Answers</text>
  <text x="600" y="130" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#475569">A practical implementation of document search + generative AI</text>

  <rect x="120" y="180" width="180" height="90" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="215" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="600" fill="#1d4ed8">1. Load Document</text>
  <text x="210" y="245" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Text from local files</text>

  <rect x="360" y="180" width="180" height="90" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="215" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="600" fill="#15803d">2. Chunk Text</text>
  <text x="450" y="245" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Break into smaller parts</text>

  <rect x="600" y="180" width="180" height="90" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="690" y="215" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="600" fill="#b45309">3. Create Embeddings</text>
  <text x="690" y="245" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Vectorize each chunk</text>

  <rect x="840" y="180" width="240" height="90" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="960" y="215" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="600" fill="#be185d">4. Store in FAISS</text>
  <text x="960" y="245" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Fast similarity search</text>

  <path d="M 300 225 L 360 225" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 540 225 L 600 225" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 780 225 L 840 225" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="270" y="360" width="260" height="140" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="395" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="600" fill="#6d28d9">5. User Question</text>
  <text x="400" y="425" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Ask anything about the document</text>

  <rect x="570" y="360" width="260" height="140" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="700" y="395" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="600" fill="#b91c1c">6. Retrieve Context</text>
  <text x="700" y="425" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Find the most relevant chunks</text>

  <rect x="870" y="360" width="220" height="140" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="980" y="395" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="600" fill="#0f766e">7. Generate Answer</text>
  <text x="980" y="425" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" fill="#334155">Use Gemini with retrieved context</text>

  <path d="M 530 430 L 570 430" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 830 430 L 870 430" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <text x="600" y="570" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="600" fill="#0f172a">Built with Python, Gemini, FAISS, and a modular project structure</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
